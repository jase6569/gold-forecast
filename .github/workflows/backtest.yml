name: Weekly backtest

on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday evening
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test (must find no edge in random prices)
        run: python run_stage1.py --selftest
      - name: Backtest on real UK gold
        run: python run_stage1.py
      - name: Save report
        run: |
          git config user.name "gold-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/backtest.json web/report.html
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%F)"
          git pull --rebase && git push
