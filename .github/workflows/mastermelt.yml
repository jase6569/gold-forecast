name: Mastermelt morning price

on:
  schedule:
    - cron: "20 9 * * 1-6"   # after Mastermelt sets its counter price
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-data
  cancel-in-progress: false

jobs:
  mastermelt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python engine/mastermelt.py && python engine/widget.py
      - name: Save price
        run: |
          git config user.name "gold-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/mastermelt.json web/data/widget.json
          git diff --cached --quiet || git commit -m "Mastermelt $(date -u +%F)"
          git pull --rebase && git push
      - name: Update the app
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: if [ -n "$HOOK" ]; then curl -s -X POST "$HOOK" > /dev/null && echo "App update requested"; else echo "No VERCEL_DEPLOY_HOOK set"; fi
